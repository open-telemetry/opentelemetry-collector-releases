name: Cleanup Old Nightly Releases

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-nightly:
    name: Cleanup Old Nightly Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to delete git tags
      packages: write   # required to delete GHCR packages
    defaults:
      run:
        shell: bash

    env:
      DISTRIBUTIONS: >-
        opentelemetry-collector
        opentelemetry-collector-contrib
        opentelemetry-collector-k8s
        opentelemetry-collector-otlp
        opentelemetry-collector-ebpf-profiler
      # Each nightly run produces multiple git tags (main, cmd/builder, cmd/opampsupervisor).
      # Cap deletions per run by number of nightly *runs*, not raw tag count, so that one
      # run's worth of tags is always removed or kept as a unit.
      MAX_NIGHTLY_RUNS: 14

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_COLLECTOR_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_COLLECTOR_RELEASES_PRIVATE_KEY }}
          permission-contents: write
          permission-packages: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.otelbot-token.outputs.token }}

      - name: Delete nightly git tags older than 2 weeks
        run: |
          CUTOFF=$(date -d '2 weeks ago' +%s)
          git fetch --tags

          # Each nightly run shares a timestamp suffix (e.g. nightly.202608050305) across all its
          # tags (main, cmd/builder, cmd/opampsupervisor). Group by that suffix so we delete or
          # keep complete runs as a unit, then cap at MAX_NIGHTLY_RUNS oldest runs.
          RUNS_TO_DELETE=$(git tag -l | grep -E 'nightly\.[0-9]+$' | while read TAG; do
            TAG_DATE=$(git log -1 --format=%ct "$TAG" 2>/dev/null || echo 0)
            if [ "$TAG_DATE" -lt "$CUTOFF" ]; then
              echo "$TAG_DATE $(echo "$TAG" | grep -oE 'nightly\.[0-9]+$')"
            fi
          done | sort -n | awk '{print $2}' | uniq | head -n "$MAX_NIGHTLY_RUNS")

          for NIGHTLY_TS in $RUNS_TO_DELETE; do
            git tag -l | grep "$NIGHTLY_TS" | while read TAG; do
              echo "Deleting git tag: $TAG"
              git push origin --delete "$TAG"
            done
          done

      - name: Delete nightly GHCR package versions older than 2 weeks
        env:
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          ORG: open-telemetry
        run: |
          CUTOFF=$(date -d '2 weeks ago' --iso-8601=seconds)

          for IMAGE in $DISTRIBUTIONS; do
            echo "Processing GHCR package: $IMAGE"

            # Collect all old nightly versions across pages, then sort oldest-first and cap.
            OLD_VERSIONS="[]"
            PAGE=1
            while true; do
              VERSIONS=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${ORG}/packages/container/${IMAGE}/versions?per_page=100&page=${PAGE}")

              COUNT=$(echo "$VERSIONS" | jq 'length')
              if [ "$COUNT" -eq 0 ]; then
                break
              fi

              BATCH=$(echo "$VERSIONS" | jq '[.[] | select(
                (.metadata.container.tags | length > 0) and
                (.metadata.container.tags | all(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))) and
                (.updated_at < "'"$CUTOFF"'")
              ) | {id: .id, tags: .metadata.container.tags, updated_at: .updated_at}]')
              OLD_VERSIONS=$(jq -n --argjson a "$OLD_VERSIONS" --argjson b "$BATCH" '$a + $b')

              PAGE=$((PAGE + 1))
            done

            echo "$OLD_VERSIONS" | jq -c 'sort_by(.updated_at) | .[:'"$MAX_NIGHTLY_RUNS"'] | .[]' | while read VERSION; do
              VERSION_ID=$(echo "$VERSION" | jq -r '.id')
              TAGS=$(echo "$VERSION" | jq -r '.tags | join(", ")')
              UPDATED=$(echo "$VERSION" | jq -r '.updated_at')
              echo "  Deleting GHCR version $VERSION_ID (tags: $TAGS, updated: $UPDATED)"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${ORG}/packages/container/${IMAGE}/versions/${VERSION_ID}"
            done
          done

      - name: Delete nightly Docker Hub tags older than 2 weeks
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
          DOCKERHUB_ORG: otel
        run: |
          CUTOFF=$(date -d '2 weeks ago' --iso-8601=seconds)

          # Obtain a Docker Hub JWT
          HUB_TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r '.token')

          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "Failed to authenticate with Docker Hub"
            exit 1
          fi

          for IMAGE in $DISTRIBUTIONS; do
            echo "Processing Docker Hub image: ${DOCKERHUB_ORG}/${IMAGE}"

            # Collect all old nightly tags across pages, then sort oldest-first and cap.
            OLD_TAGS="[]"
            PAGE=1
            while true; do
              RESPONSE=$(curl -s \
                -H "Authorization: Bearer ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_ORG}/${IMAGE}/tags/?page_size=100&page=${PAGE}")

              COUNT=$(echo "$RESPONSE" | jq '.results | length')
              if [ "$COUNT" -eq 0 ]; then
                break
              fi

              BATCH=$(echo "$RESPONSE" | jq '[.results[] | select(
                (.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")) and
                (.last_updated < "'"$CUTOFF"'")
              ) | {name: .name, last_updated: .last_updated}]')
              OLD_TAGS=$(jq -n --argjson a "$OLD_TAGS" --argjson b "$BATCH" '$a + $b')

              NEXT=$(echo "$RESPONSE" | jq -r '.next')
              if [ "$NEXT" = "null" ] || [ -z "$NEXT" ]; then
                break
              fi
              PAGE=$((PAGE + 1))
            done

            echo "$OLD_TAGS" | jq -c 'sort_by(.last_updated) | .[:'"$MAX_NIGHTLY_RUNS"'] | .[]' | while read TAG_INFO; do
              TAG_NAME=$(echo "$TAG_INFO" | jq -r '.name')
              UPDATED=$(echo "$TAG_INFO" | jq -r '.last_updated')
              echo "  Deleting Docker Hub tag: ${DOCKERHUB_ORG}/${IMAGE}:${TAG_NAME} (updated: $UPDATED)"
              curl -s -X DELETE \
                -H "Authorization: Bearer ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_ORG}/${IMAGE}/tags/${TAG_NAME}/"
            done
          done
