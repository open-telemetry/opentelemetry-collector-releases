name: Cleanup Old Nightly Releases

on:
  workflow_call:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting anything.
        type: boolean
        # The nightly schedule is expected to actually clean up.
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting anything.
        type: boolean
        # Manual runs default to a preview, so an ad-hoc dispatch cannot delete
        # anything until it is explicitly asked to.
        default: true

permissions:
  contents: read

jobs:
  cleanup-nightly:
    name: Cleanup Old Nightly Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to delete git tags
      packages: write   # required to delete GHCR packages
    defaults:
      run:
        shell: bash

    env:
      DRY_RUN: ${{ inputs.dry_run }}
      DISTRIBUTIONS: >-
        opentelemetry-collector
        opentelemetry-collector-contrib
        opentelemetry-collector-k8s
        opentelemetry-collector-otlp
        opentelemetry-collector-ebpf-profiler
      # Every artifact of a nightly run carries the same `nightly.<YYYYMMDDHHMM>` suffix: the
      # git tags (main, cmd/builder, cmd/opampsupervisor) and the container tags (one per
      # architecture, plus the multi-arch index). Cap deletions by number of nightly *runs*
      # rather than raw artifact count, so a run is always removed or kept as a whole.
      MAX_NIGHTLY_RUNS: 14

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_COLLECTOR_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_COLLECTOR_RELEASES_PRIVATE_KEY }}
          permission-contents: write
          permission-packages: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.otelbot-token.outputs.token }}

      - name: Delete nightly git tags older than 2 weeks
        run: |
          CUTOFF=$(date -u -d '2 weeks ago' +%s)
          git fetch --tags

          # Age comes from the timestamp in the tag name, not from the commit it points at:
          # nightly tags are cut from whatever main HEAD happens to be, so a quiet period
          # would make fresh tags look weeks old. Group by the shared suffix, then take the
          # MAX_NIGHTLY_RUNS oldest runs (`sort -u` on `nightly.<YYYYMMDDHHMM>` is
          # chronological).
          mapfile -t RUNS_TO_DELETE < <(
            git tag -l \
              | grep -oE 'nightly\.[0-9]{12}$' \
              | sort -u \
              | while read -r RUN; do
                  STAMP=${RUN#nightly.}
                  if ! RUN_DATE=$(date -u -d "${STAMP:0:8} ${STAMP:8:2}:${STAMP:10:2}" +%s 2>/dev/null); then
                    continue
                  fi
                  if [ "$RUN_DATE" -lt "$CUTOFF" ]; then
                    echo "$RUN"
                  fi
                done \
              | head -n "$MAX_NIGHTLY_RUNS"
          )

          if [ ${#RUNS_TO_DELETE[@]} -eq 0 ]; then
            echo "No nightly git tags older than the cutoff"
            exit 0
          fi

          # Anchor each run timestamp to the end of the tag name so the dots are literal and
          # a run can never match a longer, unrelated suffix.
          PATTERN=$(printf '%s\n' "${RUNS_TO_DELETE[@]}" | sed 's/\./\\./g' | paste -sd'|' -)
          mapfile -t TAGS_TO_DELETE < <(git tag -l | grep -E "(${PATTERN})\$")

          if [ ${#TAGS_TO_DELETE[@]} -eq 0 ]; then
            echo "No git tags matched the selected runs"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            printf 'DRY RUN: would delete git tag: %s\n' "${TAGS_TO_DELETE[@]}"
            exit 0
          fi

          printf 'Deleting git tag: %s\n' "${TAGS_TO_DELETE[@]}"
          git push origin --delete "${TAGS_TO_DELETE[@]}"

      - name: Delete nightly GHCR package versions older than 2 weeks
        env:
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          ORG: open-telemetry
          GHCR_REPO: opentelemetry-collector-releases
        run: |
          CUTOFF=$(date -u -d '2 weeks ago' +%Y-%m-%dT%H:%M:%SZ)

          for IMAGE in $DISTRIBUTIONS; do
            # Images are published under ghcr.io/<org>/<repo>/<image>, so the package name
            # includes the repo segment and its slash has to be percent-encoded for the API.
            PACKAGE="${GHCR_REPO}%2F${IMAGE}"
            echo "Processing GHCR package: ${GHCR_REPO}/${IMAGE}"

            # Collect all old nightly versions across pages, then group into runs and cap.
            OLD_VERSIONS="[]"
            PAGE=1
            while true; do
              VERSIONS=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${ORG}/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}")

              COUNT=$(echo "$VERSIONS" | jq 'length')
              if [ "$COUNT" -eq 0 ]; then
                break
              fi

              # `all` rather than `any`: a version that also carries a release tag such as
              # `latest` is left alone. `run` records which nightly run produced the version.
              BATCH=$(echo "$VERSIONS" | jq --arg cutoff "$CUTOFF" '[.[] | select(
                (.metadata.container.tags | length > 0) and
                (.metadata.container.tags | all(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+"))) and
                (.updated_at < $cutoff)
              ) | {
                id: .id,
                tags: .metadata.container.tags,
                updated_at: .updated_at,
                run: (.metadata.container.tags[0] | capture("nightly\\.(?<ts>[0-9]+)") | .ts)
              }]')
              OLD_VERSIONS=$(jq -n --argjson a "$OLD_VERSIONS" --argjson b "$BATCH" '$a + $b')

              PAGE=$((PAGE + 1))
            done

            while IFS=$'\t' read -r VERSION_ID TAGS UPDATED; do
              if [ "$DRY_RUN" = "true" ]; then
                echo "  DRY RUN: would delete GHCR version $VERSION_ID (tags: $TAGS, updated: $UPDATED)"
                continue
              fi

              echo "  Deleting GHCR version $VERSION_ID (tags: $TAGS, updated: $UPDATED)"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${ORG}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            done < <(echo "$OLD_VERSIONS" | jq -r --argjson max "$MAX_NIGHTLY_RUNS" '
              (map(.run) | unique | .[:$max]) as $runs
              | map(select(.run | IN($runs[])))
              | sort_by(.run)[]
              | [.id, (.tags | join(", ")), .updated_at] | @tsv')
          done

      - name: Delete nightly Docker Hub tags older than 2 weeks
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
          DOCKERHUB_ORG: otel
        run: |
          CUTOFF=$(date -u -d '2 weeks ago' +%Y-%m-%dT%H:%M:%SZ)

          # Obtain a Docker Hub JWT
          HUB_TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r '.token')

          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "Failed to authenticate with Docker Hub"
            exit 1
          fi

          for IMAGE in $DISTRIBUTIONS; do
            echo "Processing Docker Hub image: ${DOCKERHUB_ORG}/${IMAGE}"

            # Collect all old nightly tags across pages, then group into runs and cap.
            OLD_TAGS="[]"
            PAGE=1
            while true; do
              RESPONSE=$(curl -s \
                -H "Authorization: Bearer ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_ORG}/${IMAGE}/tags/?page_size=100&page=${PAGE}")

              COUNT=$(echo "$RESPONSE" | jq '.results | length')
              if [ "$COUNT" -eq 0 ]; then
                break
              fi

              BATCH=$(echo "$RESPONSE" | jq --arg cutoff "$CUTOFF" '[.results[] | select(
                (.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+")) and
                (.last_updated < $cutoff)
              ) | {
                name: .name,
                last_updated: .last_updated,
                run: (.name | capture("nightly\\.(?<ts>[0-9]+)") | .ts)
              }]')
              OLD_TAGS=$(jq -n --argjson a "$OLD_TAGS" --argjson b "$BATCH" '$a + $b')

              NEXT=$(echo "$RESPONSE" | jq -r '.next')
              if [ "$NEXT" = "null" ] || [ -z "$NEXT" ]; then
                break
              fi
              PAGE=$((PAGE + 1))
            done

            while IFS=$'\t' read -r TAG_NAME UPDATED; do
              if [ "$DRY_RUN" = "true" ]; then
                echo "  DRY RUN: would delete Docker Hub tag: ${DOCKERHUB_ORG}/${IMAGE}:${TAG_NAME} (updated: $UPDATED)"
                continue
              fi

              echo "  Deleting Docker Hub tag: ${DOCKERHUB_ORG}/${IMAGE}:${TAG_NAME} (updated: $UPDATED)"
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${DOCKERHUB_ORG}/${IMAGE}/tags/${TAG_NAME}/")
              if [ "$STATUS" != "204" ] && [ "$STATUS" != "202" ]; then
                echo "    Failed to delete ${DOCKERHUB_ORG}/${IMAGE}:${TAG_NAME} (HTTP $STATUS)" >&2
                exit 1
              fi
            done < <(echo "$OLD_TAGS" | jq -r --argjson max "$MAX_NIGHTLY_RUNS" '
              (map(.run) | unique | .[:$max]) as $runs
              | map(select(.run | IN($runs[])))
              | sort_by(.run)[]
              | [.name, .last_updated] | @tsv')
          done
