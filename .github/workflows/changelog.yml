name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changelog:
    permissions:
      contents: read
      pull-requests: read
    uses: open-telemetry/shared-workflows/.github/workflows/chloggen.yml@22c6d43ead71f463aa2b16ddb7081e94d2ad6a0e # v0.26.0
