name: CI - Collector Binaries

on:
  merge_group:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - otelcol
          - otelcol-contrib
          - otelcol-k8s
          - otelcol-otlp
          - otelcol-prometheus
          - otelcol-ebpf-profiler
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.26.0"
          check-latest: true

      - name: Fetch OBI source
        if: matrix.distro == 'otelcol-contrib'
        uses: ./.github/actions/fetch-obi

      - name: Tidy go.mod files
        run: go mod tidy

      - name: Verify
        run: make ci
        env:
          DISTRIBUTIONS: ${{ matrix.distro }}

      - name: Verify Prometheus distribution components and configuration
        if: matrix.distro == 'otelcol-prometheus'
        run: |
          components="$(distributions/otelcol-prometheus/_build/otelcol-prometheus components)"
          for component in stackdriver_exporter yace_exporter prometheus_remote_write opamp health_check; do
            if [[ "$components" != *"name: $component"* ]]; then
              echo "Missing required component: $component"
              exit 1
            fi
          done
          distributions/otelcol-prometheus/_build/otelcol-prometheus validate \
            --config=tests/docker-tests/prometheus-config.yaml

  build-result:
    name: "Build Result"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Build for all distros succeeded"
