name: Release eBPF Profiler

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release eBPF Profiler
    uses: ./.github/workflows/base-release.yaml
    with:
      distribution: otelcol-ebpf-profiler
      goos: '[ "linux" ]'
      goarch: '[ "amd64", "arm64" ]'
      nightly: ${{ contains(github.ref, '-nightly') }}
    secrets:
      DOCKER_TOKEN_COLLECTOR_RELEASES: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
