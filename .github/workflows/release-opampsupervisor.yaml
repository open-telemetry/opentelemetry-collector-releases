name: Release OpAMP supervisor

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release OpAMP supervisor
    uses: ./.github/workflows/base-binary-release.yaml
    with:
      binary: opampsupervisor
      collector-dependency: 'open-telemetry/opentelemetry-collector-contrib'
      dependency-target-folder: '.contrib'
      windows-msi: true
    secrets:
      DOCKER_TOKEN_COLLECTOR_RELEASES: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    permissions:
      contents: write
      id-token: write
      packages: write
