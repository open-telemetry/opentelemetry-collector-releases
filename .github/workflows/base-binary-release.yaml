name: Reusable binary release workflow
on:
  workflow_call:
    inputs:
      binary:
        required: true
        type: string
        description: "Which binary to release. Possible options: ['builder', 'opampsupervisor']"
      collector-dependency:
        required: false
        type: string
        default: ""
        description: "Set this to the repo slug of collector core or contrib to check out if it's needed as a dependency"
      dependency-target-folder:
        required: false
        type: string
        default: ""
        description: "The collector dependency will be put into this folder"
      windows-msi:
        required: false
        type: boolean
        default: false
        description: "Set to true if the binary needs a Windows MSI to be built"

env:
  # renovate: datasource=github-releases packageName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.18.0

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      packages: write
      contents: write

    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set COLLECTOR_REF
        id: collector-ref
        env:
          BINARY: ${{ inputs.binary }}
        run: ./.github/workflows/scripts/collector-ref.sh

      - name: Push ${{ inputs.binary }} Tag
        run: |
          tag="cmd/${INPUTS_BINARY}/${GITHUB_REF_NAME}"
          message="Releasing ${INPUTS_BINARY} binaries for ${STEPS_COLLECTOR_REF_OUTPUTS_COLLECTOR_REF}"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "${tag}" > /dev/null; then
            echo "Tag ${tag} already exists on origin, skipping creation (this is a retry)"
          else
            git tag -a "${tag}" -m "${message}"
            git push origin "${tag}"
          fi
        env:
          INPUTS_BINARY: ${{ inputs.binary }}
          STEPS_COLLECTOR_REF_OUTPUTS_COLLECTOR_REF: ${{ steps.collector-ref.outputs.COLLECTOR_REF }}

      - name: Set goreleaser last tag reference in case of non-nightly release
        id: prev-tag
        if: ${{ !contains(github.ref, '-nightly') }}
        # find previous tag by taking only binary tags, filtering out nightly tags and then choosing the
        # second to last tag (last one is the current release)
        run: |
          prev_tag=$(git tag | grep "cmd/${INPUTS_BINARY}" | grep -v "nightly" | sort -r --version-sort | head -n 2 | tail -n 1)
          current_tag="cmd/${INPUTS_BINARY}/${GITHUB_REF_NAME}"
          echo "PREVIOUS_RELEASE_TAG=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "CURRENT_TAG=$current_tag" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_BINARY: ${{ inputs.binary }}

      - name: Set nightly enabled
        id: nightly-check
        if: ${{ contains(github.ref, '-nightly') }}
        run: |
          echo "NIGHTLY_FLAG=--nightly" >> "$GITHUB_OUTPUT"

      - name: Checkout Collector dependency repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ inputs.collector-dependency }}
          ref: ${{ steps.collector-ref.outputs.COLLECTOR_REF }}
          path: ${{ inputs.dependency-target-folder }}

      - name: Copy Dockerfile to Collector dependency directory
        run: cp cmd/${INPUTS_BINARY}/Dockerfile ${INPUTS_DEPENDENCY_TARGET_FOLDER}/cmd/${INPUTS_BINARY}/Dockerfile
        env:
          INPUTS_BINARY: ${{ inputs.binary }}
          INPUTS_DEPENDENCY_TARGET_FOLDER: ${{ inputs.dependency-target-folder }}

      - name: Copy MSI files to Core Repo directory
        if: inputs.windows-msi == true
        run: |
          cp cmd/${INPUTS_BINARY}/opentelemetry.ico ${INPUTS_DEPENDENCY_TARGET_FOLDER}/cmd/${INPUTS_BINARY}
          cp cmd/${INPUTS_BINARY}/config.windows.example.yaml ${INPUTS_DEPENDENCY_TARGET_FOLDER}/cmd/${INPUTS_BINARY}
        env:
          INPUTS_BINARY: ${{ inputs.binary }}
          INPUTS_DEPENDENCY_TARGET_FOLDER: ${{ inputs.dependency-target-folder }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64,ppc64le,riscv64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.26.0"

      - name: Setup wixl # Required to build MSI packages for Windows
        if: inputs.windows-msi == true && runner.os != 'Windows'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: sudo apt-get update && sudo apt-get install -y wixl

      - name: Log into Docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}

      - name: Login to GitHub Package Registry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 15
          shell: bash
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          args: release --clean -f cmd/${{ inputs.binary }}/.goreleaser.yaml ${{ steps.nightly-check.outputs.NIGHTLY_FLAG }}
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: true
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}
          GORELEASER_CURRENT_TAG: ${{ steps.prev-tag.outputs.CURRENT_TAG }}
