name: Update Version in Distributions and Prepare PR
on:
  workflow_dispatch:
    inputs:
      repo_only_release:
        description: 'Bump patch version for a releases-repo-only change (no new core/contrib release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-version:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write # required for pushing changes
      pull-requests: write # required for creating PR

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_COLLECTOR_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_COLLECTOR_RELEASES_PRIVATE_KEY }}

      - name: Set up commit author name and email
        id: committer
        run: |
          git config --global user.name "otelbot"
          git config --global user.email "197425009+otelbot@users.noreply.github.com"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.otelbot-token.outputs.token }}

      - name: Run bump-versions.sh
        run: |
          ARGS="--commit --pull-request"
          if [ "${{ inputs.repo_only_release }}" = "true" ]; then
            ARGS="$ARGS --repo-only-release"
          fi
          .github/workflows/scripts/bump-versions.sh $ARGS
        env:
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
