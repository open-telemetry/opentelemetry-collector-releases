name: Release k8s

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release k8s
    uses: ./.github/workflows/base-release.yaml
    with:
      distribution: otelcol-k8s
      goos: '[ "linux" ]'
      goarch: '[ "amd64", "arm64", "ppc64le", "riscv64", "s390x" ]'
      nightly: ${{ contains(github.ref, '-nightly') }}
    secrets:
      DOCKER_TOKEN_COLLECTOR_RELEASES: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
  release-windows:
    name: Release k8s (Windows)
    if: ${{ !contains(github.ref, '-nightly') }}
    uses: ./.github/workflows/base-release.yaml
    with:
      distribution: otelcol-k8s
      goos: '[ "windows" ]'
      goarch: '[ "386", "amd64", "arm64" ]'
      runner_os: windows-2022
    secrets:
      DOCKER_TOKEN_COLLECTOR_RELEASES: ${{ secrets.DOCKER_TOKEN_COLLECTOR_RELEASES }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
