name: Reusable GoReleaser CI workflow

on:
  workflow_call:
    inputs:
      distribution:
        required: true
        type: string
      goos:
        required: true
        type: string
      goarch:
        required: true
        type: string
      runner_os:
        required: false
        type: string
        default: ubuntu-24.04
      nightly:
        required: false
        type: boolean
        default: false
        description: "Set to true to fetch latest otelcol-contrib main branch version instead of building the version in this repo"
      config_file:
        required: false
        type: string
        default: default-config.yaml
      docker_run_options:
        required: false
        type: string
      otelcol_run_options:
        required: false
        type: string

permissions:
  contents: read

env:
  # renovate: datasource=github-releases packageName=goreleaser/goreleaser-pro
  GORELEASER_PRO_VERSION: v2.18.0

jobs:
  prev-tag:
    outputs:
      PREVIOUS_RELEASE_TAG: ${{ steps.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set goreleaser last tag reference in case of non-nightly release
        id: prev-tag
        if: inputs.nightly != 'true'
        # find previous tag by filtering out nightly tags and binary release (OCB, OpAMP) tags and then choosing the
        # second to last tag (last one is the current release)
        run: |
          prev_tag=$(git tag | grep -v "cmd" | grep -v "nightly" | sort -r --version-sort | head -n 2 | tail -n 1)
          echo "PREVIOUS_RELEASE_TAG=$prev_tag" >> "$GITHUB_OUTPUT"

  check-goreleaser:
    strategy:
      matrix:
        GOOS: ${{ fromJSON( inputs.goos) }}
        GOARCH: ${{ fromJSON( inputs.goarch) }}
        exclude:
          - GOOS: darwin
            GOARCH: "386"
          - GOOS: darwin
            GOARCH: s390x
          - GOOS: darwin
            GOARCH: arm
          - GOOS: windows
            GOARCH: arm
          - GOOS: windows
            GOARCH: s390x
          - GOOS: darwin
            GOARCH: ppc64le
          - GOOS: windows
            GOARCH: ppc64le
          - GOOS: darwin
            GOARCH: riscv64
          - GOOS: windows
            GOARCH: riscv64
    runs-on: ${{ inputs.runner_os }}
    needs: prev-tag
    outputs:
      version: ${{ steps.prep.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup QEMU
        if: runner.os != 'Windows'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,ppc64le,linux/arm/v7,s390x,riscv64

      - name: Start Docker daemon (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Start-Service docker

      - name: Setup Docker Buildx
        if: runner.os != 'Windows'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.26.0"
          check-latest: true

      - name: Fetch OBI source
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly != true
        uses: ./.github/actions/fetch-obi

      - name: Create artifacts directory to store build artifacts
        if: inputs.distribution == 'otelcol-contrib'
        run: mkdir -p distributions/otelcol-contrib/artifacts

      - name: "[Nightly] Get latest finished run ID from contrib repo build-and-test"
        id: get-run-id
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly == true && matrix.GOARCH == 'amd64' && matrix.GOOS == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --branch main \
            --workflow build-and-test \
            --repo open-telemetry/opentelemetry-collector-contrib \
            --limit 1 \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId' \
          )
          echo "Found run ID: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: "[Nightly] Create sub-directory for otelcol-contrib nightly build"
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly == true && matrix.GOARCH == 'amd64' && matrix.GOOS == 'linux'
        run: mkdir -p distributions/otelcol-contrib/artifacts/otelcol-contrib_linux_amd64_v1

      - name: "[Nightly] Download built otelcol-contrib artifact from contrib repo"
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly == true && matrix.GOARCH == 'amd64' && matrix.GOOS == 'linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collector-binaries-linux-amd64
          repository: open-telemetry/opentelemetry-collector-contrib
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: "[Nightly] Move downloaded artifact"
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly == true && matrix.GOARCH == 'amd64' && matrix.GOOS == 'linux'
        env:
          folder: distributions/otelcol-contrib/artifacts/otelcol-contrib-linux_linux_amd64_v1/
        run: |
          mkdir -p ${{ env.folder }}
          mv otelcontribcol_linux_amd64 ${{ env.folder }}/otelcol-contrib

      - name: Generate the sources for ${{ inputs.distribution }}
        if: inputs.nightly != true
        env:
          DISTRIBUTIONS: ${{ inputs.distribution }}
        run: make generate-sources

        # otelcol-contrib is built in a separate stage
      - name: Build ${{ inputs.distribution }}
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly != true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          workdir: distributions/otelcol-contrib
          args: --snapshot --clean --timeout 2h --split --config .goreleaser-build.yaml
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: "7" # Default is 6
          GOAMD64: v1
          GOPPC64: power8
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}

      - name: Move built artifacts
        if: inputs.distribution == 'otelcol-contrib' && inputs.nightly != true
        run: mv distributions/otelcol-contrib/dist/**/* distributions/otelcol-contrib/artifacts/

      - name: Show built or downloaded content
        if: inputs.distribution == 'otelcol-contrib' && runner.os != 'Windows'
        run: ls -laR distributions/otelcol-contrib/artifacts

      - name: Run GoReleaser for ${{ inputs.distribution }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: ${{ env.GORELEASER_PRO_VERSION }}
          workdir: distributions/${{ inputs.distribution }}
          args: --snapshot --clean --skip=sign,sbom --timeout 2h --split
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          GOARM: "7" # Default is 6
          GOAMD64: v1
          GOPPC64: power8
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}

      - name: Print built artifacts
        shell: bash
        run: cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/artifacts.json
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Print metadata
        shell: bash
        run: cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/metadata.json
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Print dist folder contents
        if: always() && runner.os != 'Windows'
        shell: bash
        run: ls -laR ./distributions/${INPUTS_DISTRIBUTION}/dist
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Upload linux service packages
        if: ${{ matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64' && (inputs.distribution == 'otelcol-contrib' || inputs.distribution == 'otelcol') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: distributions/${{ inputs.distribution }}/dist/linux_amd64_v1/*
          if-no-files-found: error

      - name: Upload MSI packages
        if: matrix.GOOS == 'windows' && matrix.GOARCH == 'amd64' && (inputs.distribution == 'otelcol-contrib' || inputs.distribution == 'otelcol')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-packages
          path: distributions/${{ inputs.distribution }}/dist/windows_amd64_v1/**/*.msi
          if-no-files-found: error

      - name: Prepare variables
        if: matrix.GOOS == 'linux' || matrix.GOOS == 'windows' || matrix.GOOS == 'aix'
        id: prep
        shell: bash
        run: |
          # Find version number and types of built artifacts
          version=$(cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/metadata.json | jq -r '.version')
          arch="${MATRIX_GOOS}-${MATRIX_GOARCH}"
          
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "arch=$arch" >> $GITHUB_OUTPUT
          echo "types=$(cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/artifacts.json | jq '[.[].type]' | tr -d '\n' )" >> $GITHUB_OUTPUT
          
          # Find binary path
          echo "binarypath=$(cat ./distributions/${INPUTS_DISTRIBUTION}/dist/**/artifacts.json | jq -r 'map(select(any(.type; contains("Binary")))) | .[].path' )" >> "$GITHUB_OUTPUT"
          
          echo "TAG=${INPUTS_DISTRIBUTION}:$version-$arch" >> $GITHUB_ENV
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
          MATRIX_GOOS: ${{ matrix.GOOS }}
          MATRIX_GOARCH: ${{ matrix.GOARCH }}


      - name: Print version and target
        if: matrix.GOOS == 'linux' || matrix.GOOS == 'windows' || matrix.GOOS == 'aix'
        shell: bash
        run: |
          echo "Version: ${STEPS_PREP_OUTPUTS_VERSION}"
          echo "Types: ${STEPS_PREP_OUTPUTS_TYPES}"
          echo "Arch: ${STEPS_PREP_OUTPUTS_ARCH}"
          echo "Binary path: ${STEPS_PREP_OUTPUTS_BINARYPATH}"
          echo "Images?: ${STEPS_PREP_OUTPUTS_CONTAINER_IMAGES}"
          echo "Image tag: ${TAG}"
        env:
          STEPS_PREP_OUTPUTS_VERSION: ${{ steps.prep.outputs.version }}
          STEPS_PREP_OUTPUTS_TYPES: ${{ steps.prep.outputs.types }}
          STEPS_PREP_OUTPUTS_ARCH: ${{ steps.prep.outputs.arch }}
          STEPS_PREP_OUTPUTS_BINARYPATH: ${{ steps.prep.outputs.binarypath }}
          STEPS_PREP_OUTPUTS_CONTAINER_IMAGES: ${{ steps.prep.outputs.container-images }}

      - name: Copy binary to distro root folder
        if: matrix.GOOS == 'linux' || matrix.GOOS == 'windows' || matrix.GOOS == 'aix'
        shell: bash
        run: cp ./distributions/${INPUTS_DISTRIBUTION}/${STEPS_PREP_OUTPUTS_BINARYPATH} ./distributions/${INPUTS_DISTRIBUTION}
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
          STEPS_PREP_OUTPUTS_BINARYPATH: ${{ steps.prep.outputs.binarypath }}

      - name: Build container images locally (Linux)
        if: matrix.GOOS == 'linux' && contains(steps.prep.outputs.types, 'Docker Image')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./distributions/${{ inputs.distribution }}
          push: false
          load: true
          tags: ${{ env.TAG }}

      - name: Build container images locally (Windows)
        if: matrix.GOOS == 'windows' && contains(steps.prep.outputs.types, 'Docker Image')
        shell: powershell
        run: |
          docker build -f ./distributions/$env:INPUTS_DISTRIBUTION/Windows.dockerfile `
            -t $env:TAG `
            --build-arg WIN_VERSION=2022 `
            --build-arg WIN_VERSION_SHA=sha256:e4ce8c20390c3785c3cbeef15c579d186b3599d37525c596590cf4508e38d3ff `
            ./distributions/$env:INPUTS_DISTRIBUTION/
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Export container image to tarball
        if: (matrix.GOOS == 'linux' || matrix.GOOS == 'windows') && contains(steps.prep.outputs.types, 'Docker Image')
        shell: bash
        run: |
          docker save --output "${RUNNER_TEMP}/${INPUTS_DISTRIBUTION}.tar" "${TAG}"
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Upload container image artifact
        if: (matrix.GOOS == 'linux' || matrix.GOOS == 'windows') && contains(steps.prep.outputs.types, 'Docker Image')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-image-${{ steps.prep.outputs.version }}-${{ steps.prep.outputs.arch }}
          path: ${{ runner.temp }}/${{ inputs.distribution }}.tar
          retention-days: 7

      - if: always()
        run: ./.github/workflows/scripts/check-disk-space.sh

  docker-tests:
    if: inputs.goos != '[ "aix" ]'
    needs:
      - check-goreleaser
    strategy:
      matrix:
        GOOS: ${{ fromJSON( inputs.goos) }}
        GOARCH: ${{ fromJSON( inputs.goarch) }}
        exclude:
          - GOOS: darwin
          - GOOS: windows
            GOARCH: "386"
          - GOOS: windows
            GOARCH: arm64
    runs-on: ${{ inputs.runner_os }}
    env:
      TAG: ${{ needs.check-goreleaser.outputs.version }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        if: runner.os != 'Windows'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,ppc64le,linux/arm/v7,s390x,riscv64

      - name: Start Docker daemon (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Start-Service docker

      - name: Download container image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution }}-image-${{ env.TAG }}

      - name: Load image into docker
        shell: bash
        run: |
          docker image load --input ./${INPUTS_DISTRIBUTION}.tar
          docker image ls
          docker image inspect ${INPUTS_DISTRIBUTION}:${TAG}
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - name: Run container image (Linux)
        if: matrix.GOOS == 'linux'
        shell: bash
        run: |
          echo "Running container..."
          docker run --name ${INPUTS_DISTRIBUTION} \
            -d \
            ${INPUTS_DOCKER_RUN_OPTIONS} \
            -v ${PWD}/tests/docker-tests/${INPUTS_CONFIG_FILE}:/config.yaml \
            ${INPUTS_DISTRIBUTION}:${TAG} \
            ${INPUTS_OTELCOL_RUN_OPTIONS} --config /config.yaml
          echo "docker ps:"
          echo ""
          docker ps
          echo "Sleeping for a bit..."
          sleep 10
          echo "Checking logs for correct startup..."
          docker logs ${INPUTS_DISTRIBUTION} &>docker-logs-${INPUTS_DISTRIBUTION}.log
          if cat docker-logs-${INPUTS_DISTRIBUTION}.log | grep "Everything is ready."; then
            echo "${INPUTS_DISTRIBUTION} started up correctly"
          else
            echo "${INPUTS_DISTRIBUTION} failed to start"
            echo "Printing container logs below..."
            echo ""
            cat docker-logs-${INPUTS_DISTRIBUTION}.log
            exit 1
          fi
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
          INPUTS_DOCKER_RUN_OPTIONS: ${{ inputs.docker_run_options }}
          INPUTS_CONFIG_FILE: ${{ inputs.config_file }}
          INPUTS_OTELCOL_RUN_OPTIONS: ${{ inputs.otelcol_run_options }}

      - name: Run container image (Windows)
        if: matrix.GOOS == 'windows'
        shell: powershell
        run: |
          echo "Running container..."
          docker run --name $env:INPUTS_DISTRIBUTION `
            -d `
            $env:INPUTS_DOCKER_RUN_OPTIONS `
            -v ${PWD}\tests\docker-tests:C:\config `
            "${env:INPUTS_DISTRIBUTION}:${env:TAG}" `
            --config "C:\config\${env:INPUTS_CONFIG_FILE}" `
            $env:INPUTS_OTELCOL_RUN_OPTIONS
          echo "docker ps:"
          echo ""
          docker ps
          echo "Sleeping for a bit..."
          sleep 10
          echo "Checking logs for correct startup..."
          # Don't let the collector's stderr logs trip PowerShell's 'Stop' preference.
          $ErrorActionPreference = 'Continue'
          docker logs $env:INPUTS_DISTRIBUTION 2>&1 | Out-File -FilePath "docker-logs-${env:INPUTS_DISTRIBUTION}.log"
          if (Get-Content "docker-logs-${env:INPUTS_DISTRIBUTION}.log" | Select-String -Pattern "Everything is ready.") {
            echo "$env:INPUTS_DISTRIBUTION started up correctly"
          } else {
            echo "$env:INPUTS_DISTRIBUTION failed to start"
            echo "Printing container logs below..."
            echo ""
            Get-Content "docker-logs-${env:INPUTS_DISTRIBUTION}.log"
            exit 1
          }
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}
          INPUTS_DOCKER_RUN_OPTIONS: ${{ inputs.docker_run_options }}
          INPUTS_CONFIG_FILE: ${{ inputs.config_file }}
          INPUTS_OTELCOL_RUN_OPTIONS: ${{ inputs.otelcol_run_options }}

      - name: Run golden tests
        if: matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64' && inputs.distribution == 'otelcol-contrib'
        shell: bash
        run: |
          echo "Running golden tests..."
          cd tests/golden
          MY_UID="$(id -u)" MY_GID="$(id -g)" IMG=${INPUTS_DISTRIBUTION}:${TAG} docker compose up -d --wait
          exit_code=$(docker wait golden)
          docker logs golden
          if [ "$exit_code" -ne 0 ]; then
            docker logs collector
            exit 1
          fi
        env:
          INPUTS_DISTRIBUTION: ${{ inputs.distribution }}

      - if: always()
        run: ./.github/workflows/scripts/check-disk-space.sh
