dist:
  module: github.com/open-telemetry/opentelemetry-collector-releases/core
  name: otelcol
  description: OpenTelemetry Collector
  version: 0.165.0
  output_path: ./_build
  build_tags: "grpcnotrace"

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.166.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jaegerreceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kafkareceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/zipkinreceiver v0.166.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.166.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.166.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.166.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/zipkinexporter v0.166.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.166.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.166.0
  - gomod: go.opentelemetry.io/collector/processor/queuebatchprocessor v0.166.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/spanprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/probabilisticsamplerprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.166.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.166.0

connectors:
  - gomod: go.opentelemetry.io/collector/connector/forwardconnector v0.166.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.72.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.72.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.72.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.72.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.72.0
